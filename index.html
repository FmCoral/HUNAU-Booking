  <!-- Toast -->

<script>
  const toast = document.getElementById('toast');
  let timer = null;

  // 背景 HUNAU 纵向拉伸到距上下边缘各 10px（字形宽度不变）
  const bgWord = document.getElementById('bgWord');
  const measureCtx = document.createElement('canvas').getContext('2d');

  function fitBgWord() {
    bgWord.style.transform = 'none';
    const cs = getComputedStyle(bgWord);
    const rect = bgWord.getBoundingClientRect();
    const target = window.innerHeight - 40;

    let glyphHeight = rect.height * 0.72;
    let offsetY = 0;

    if (measureCtx) {
      measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const text = bgWord.textContent.trim();
      const m = measureCtx.measureText(text);
      const inkTop = m.actualBoundingBoxAscent;
      const inkBottom = m.actualBoundingBoxDescent;

      if (inkTop + inkBottom > 0) {
        glyphHeight = inkTop + inkBottom;

        // 字形墨迹中心相对行盒中心的偏移（字体上下留白不对称）
        const fontAscent = m.fontBoundingBoxAscent ?? inkTop;
        const fontDescent = m.fontBoundingBoxDescent ?? inkBottom;
        const halfLeading = (rect.height - (fontAscent + fontDescent)) / 2;
        const baselineFromTop = halfLeading + fontAscent;
        const inkCenterFromTop = baselineFromTop - (inkTop - inkBottom) / 2;
        offsetY = inkCenterFromTop - rect.height / 2;
      }
    }

    if (glyphHeight <= 0) return;
    const s = target / glyphHeight;
    // 先缩放再平移，抵消墨迹中心偏移，保证上下各留 10px
    bgWord.style.transform =
      `scaleY(${s.toFixed(3)}) translateY(${(-offsetY).toFixed(2)}px)`;
  }

  fitBgWord();
  window.addEventListener('resize', fitBgWord);

  // 点击下载
  document.getElementById('downloadBtn').addEventListener('click', () => {
    toast.textContent = '正在下载 Book，请稍候…';
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 2400);
  });
</script>
